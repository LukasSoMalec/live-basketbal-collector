name: Recover historical LIVE collector snapshots
on:
  push:
    paths:
      - 'scripts/recover_live_snapshots.py'
      - '.github/workflows/recover-live.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_FROM: '2026-11-03'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Download archived live snapshots
        run: python scripts/recover_live_snapshots.py
      - name: Store recovery dataset for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-live-snapshots-${{ github.run_id }}
          path: recovery-output/
          retention-days: 30
          if-no-files-found: warn
