name: Audit missing LIVE snapshots (read-only)
on:
  push:
    paths:
      - '.github/workflows/audit-missing-live.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Recover two original snapshots for sheet reconciliation
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, json, os, urllib.request, zipfile
          ids = (13992034485, 13999234536)
          for artifact_id in ids:
              url = 'https://api.github.com/repos/' + os.environ['GH_REPO'] + '/actions/artifacts/' + str(artifact_id) + '/zip'
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'github-live-snapshot-recovery',
                  'X-GitHub-Api-Version': '2022-11-28'
              })
              with urllib.request.urlopen(req, timeout=45) as response:
                  archive = response.read()
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  candidates = [n for n in z.namelist() if n.endswith('latest.json')]
                  if len(candidates) != 1:
                      raise RuntimeError('Expected exactly one latest.json in artifact ' + str(artifact_id))
                  payload = json.loads(z.read(candidates[0]))
              if not isinstance(payload.get('checkedAt'), str) or not isinstance(payload.get('sources'), list):
                  raise ValueError('Invalid source snapshot ' + str(artifact_id))
              if len(payload['sources']) != 4:
                  raise ValueError('Not all sources present in ' + str(artifact_id))
              src_names = {s.get('source') for s in payload['sources']}
              if src_names != {'SynotTip', 'Football.com', 'Fonbet', '1xBit'}:
                  raise ValueError('Unexpected source names ' + str(src_names))
              package = {'artifact_id': artifact_id, 'snapshot': payload}
              blob = base64.urlsafe_b64encode(json.dumps(package, separators=(',', ':'), ensure_ascii=False).encode('utf-8')).decode('ascii')
              blocks = [blob[i:i + 2500] for i in range(0, len(blob), 2500)]
              print('RECOVERY_HEADER|' + str(artifact_id) + '|' + payload['checkedAt'] + '|' +
                    str(sum(len(s.get('matches', [])) for s in payload['sources'])) + '|' + str(len(blocks)), flush=True)
              for i, block in enumerate(blocks):
                  print('RECOVERY_CHUNK|' + str(artifact_id) + '|' + str(i) + '|' + str(len(blocks)) + '|' + block, flush=True)
          print('RECOVERY_COMPLETE', flush=True)
          PY
