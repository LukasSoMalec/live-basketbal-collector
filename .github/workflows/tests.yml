name: Collector regression tests
on:
  push:
    paths:
      - 'GoogleAppsScript.gs'
      - 'ScheduledDedupe.gs'
      - 'AIQueueMerge.gs'
      - 'AutoMerge.gs'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: node tests/test_apps_script.cjs
      - run: node tests/test_apps_script_dedupe.cjs
      - run: node tests/test_auto_merge.cjs
      - run: node tests/test_ai_queue.cjs
      - run: python -m unittest discover -s tests -v
