name: Collector regression tests
on:
  push:
    paths:
      - 'GoogleAppsScript.gs'
      - 'ScheduledDedupe.gs'
      - 'AIQueueMerge.gs'
      - 'AutoMerge.gs'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/live-basketball.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate hourly backup scheduler
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import yaml, subprocess
          with open('.github/workflows/live-basketball.yml') as f:
              workflow=yaml.safe_load(f)
          job=workflow['jobs']['collect']
          assert job['permissions'] if 'permissions' in job else workflow['permissions']['actions']=='read'
          steps=job['steps']
          assert steps[0]['id']=='gate'
          subprocess.run(['bash','-n'],input=steps[0]['run'],text=True,check=True)
          assert any('collector.py' in str(s.get('run','')) and
                     s.get('if')=="steps.gate.outputs.collect == 'true'"
                     for s in steps)
          print('Hourly schedule, backup gate and Bash syntax validated')
          PY
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-1.55
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - run: node --check LiveBasketbalAutoMerge.user.js
      - run: node tests/test_apps_script.cjs
      - run: node tests/test_apps_script_dedupe.cjs
      - run: node tests/test_auto_merge.cjs
      - run: node tests/test_ai_queue.cjs
      - run: python -m unittest discover -s tests -v
