name: Collector regression tests
on:
  push:
    paths:
      - 'collector.py'
      - 'GoogleAppsScript.gs'
      - 'ScheduledDedupe.gs'
      - 'AIQueueMerge.gs'
      - 'AutoMerge.gs'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/live-basketball.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate cron-job.org-only dispatcher
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import yaml
          with open('.github/workflows/live-basketball.yml') as f:
              workflow=yaml.safe_load(f)
          triggers=workflow.get('on',workflow.get(True))
          assert set(triggers)=={'workflow_dispatch'}, triggers
          job=workflow['jobs']['collect']
          assert job['concurrency'] if 'concurrency' in job else workflow['concurrency']['cancel-in-progress'] is False
          steps=job['steps']
          assert not any('gate' in str(step.get('if','')) for step in steps)
          assert not any('Choose scheduled' in step.get('name','') for step in steps)
          assert any(step.get('name')=='Check destination configuration' for step in steps)
          assert any(step.get('name')=='Collect and update sheet' and step.get('run')=='python collector.py' and not step.get('if') for step in steps)
          assert any(step.get('name')=='Save last snapshot' and step.get('if')=='always()' for step in steps)
          print('Only cron-job.org workflow_dispatch triggers collection; no skip gate')
          PY
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-1.55
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - run: node --check LiveBasketbalAutoMerge.user.js
      - run: node tests/test_apps_script.cjs
      - run: node tests/test_apps_script_dedupe.cjs
      - run: node tests/test_auto_merge.cjs
      - run: node tests/test_ai_queue.cjs
      - name: Validate collector syntax and timeout safety
        run: |
          python -m py_compile collector.py
          python - <<'PY'
          from pathlib import Path
          code = Path("collector.py").read_text(encoding="utf-8")
          assert 'httpx.Timeout(330.0, connect=30.0, write=30.0, pool=30.0)' in code
          assert 'except httpx.ReadTimeout:' in code
          assert code.count('await client.post(url, json={**data, "key": key})') == 1
          print("Collector wait window and non-replay protection verified")
          PY
      - run: python -m unittest discover -s tests -v
